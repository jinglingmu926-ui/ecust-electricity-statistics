name: Deploy electricity dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - analytics.mjs
      - .github/workflows/deploy-dashboard.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: electricity-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Package only dashboard assets
        run: |
          mkdir -p _site
          cp index.html app.js styles.css analytics.mjs snapshot.json _site/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
